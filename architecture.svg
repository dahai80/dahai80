<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#24292f">Fusion — Local-First AI Ecosystem for Apple Silicon</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#57606a">One inference core, nine surfaces · 100% local · zero cloud dependency</text>

  <!-- ============ SHELL LAYER ============ -->
  <g>
    <rect x="60" y="84" width="840" height="72" rx="10" fill="#fbf0ea" stroke="#e7c3ae"/>
    <text x="80" y="106" font-size="11" font-weight="700" fill="#9a5b2f" letter-spacing="1">SHELL</text>
    <rect x="80" y="114" width="170" height="32" rx="6" fill="#ffffff" stroke="#e7c3ae"/>
    <text x="165" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-studio</text>
    <text x="80" y="150" font-size="10" fill="#57606a" transform="translate(0,-16)" opacity="0">.</text>
    <rect x="270" y="114" width="170" height="32" rx="6" fill="#ffffff" stroke="#e7c3ae"/>
    <text x="355" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-browser</text>
    <rect x="460" y="114" width="170" height="32" rx="6" fill="#ffffff" stroke="#e7c3ae"/>
    <text x="545" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-web-shell</text>
    <rect x="650" y="114" width="170" height="32" rx="6" fill="#ffffff" stroke="#e7c3ae"/>
    <text x="735" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-cli (Rust)</text>
  </g>

  <!-- arrows shell -> apps -->
  <line x1="480" y1="156" x2="480" y2="178" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ APPLICATION / DOMAIN LAYER ============ -->
  <g>
    <rect x="60" y="182" width="840" height="128" rx="10" fill="#eaf3fb" stroke="#b9d5ea"/>
    <text x="80" y="204" font-size="11" font-weight="700" fill="#2b6cb0" letter-spacing="1">APPLICATIONS &amp; DOMAINS</text>

    <text x="80" y="222" font-size="10" fill="#57606a">Apps</text>
    <rect x="80" y="228" width="150" height="30" rx="6" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="155" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-code</text>
    <rect x="245" y="228" width="150" height="30" rx="6" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="320" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-agent-studio</text>
    <rect x="410" y="228" width="150" height="30" rx="6" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="485" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-doc</text>
    <rect x="575" y="228" width="150" height="30" rx="6" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="650" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-design</text>
    <rect x="740" y="228" width="140" height="30" rx="6" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="810" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-cowork</text>

    <text x="80" y="278" font-size="10" fill="#57606a">Domains</text>
    <rect x="80" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="133" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-science</text>
    <rect x="196" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="249" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-finance</text>
    <rect x="312" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="365" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-health</text>
    <rect x="428" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="481" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-simulation</text>
    <rect x="544" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="597" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-k12-teacher</text>
    <rect x="660" y="284" width="106" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="713" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-security</text>
    <rect x="776" y="284" width="104" height="16" rx="4" fill="#ffffff" stroke="#b9d5ea"/>
    <text x="828" y="296" text-anchor="middle" font-size="9.5" fill="#24292f">fusion-multi-node</text>
  </g>

  <!-- arrows apps -> governance -->
  <line x1="480" y1="310" x2="480" y2="332" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ GOVERNANCE / CONTEXT LAYER ============ -->
  <g>
    <rect x="60" y="336" width="840" height="128" rx="10" fill="#eef8ee" stroke="#b7d8b7"/>
    <text x="80" y="358" font-size="11" font-weight="700" fill="#2f7d33" letter-spacing="1">GOVERNANCE &amp; CONTEXT</text>

    <rect x="80" y="372" width="250" height="40" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="205" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-memory (Rust)</text>
    <text x="205" y="405" text-anchor="middle" font-size="9.5" fill="#57606a">long/short-term memory · forgetting curve · KG alignment</text>

    <rect x="350" y="372" width="160" height="40" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="430" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-kb</text>
    <text x="430" y="405" text-anchor="middle" font-size="9.5" fill="#57606a">knowledge base</text>

    <rect x="530" y="372" width="160" height="40" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="610" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-identity</text>
    <text x="610" y="405" text-anchor="middle" font-size="9.5" fill="#57606a">tenant / identity / auth</text>

    <rect x="710" y="372" width="170" height="40" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="795" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">fusion-supervisor</text>
    <text x="795" y="405" text-anchor="middle" font-size="9.5" fill="#57606a">start/stop · crash recovery · metrics</text>

    <rect x="80" y="426" width="250" height="24" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="205" y="442" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-bench — benchmarks</text>
    <rect x="350" y="426" width="160" height="24" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="430" y="442" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-model-hub</text>
    <rect x="530" y="426" width="160" height="24" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="610" y="442" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-gateway (Go, :11432)</text>
    <rect x="710" y="426" width="170" height="24" rx="6" fill="#ffffff" stroke="#b7d8b7"/>
    <text x="795" y="442" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-plugins-ecosystem</text>
  </g>

  <!-- arrows governance -> shared foundation -->
  <line x1="480" y1="464" x2="480" y2="486" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ SHARED FOUNDATION ============ -->
  <g>
    <rect x="60" y="490" width="840" height="58" rx="10" fill="#f3effa" stroke="#cdbcea"/>
    <text x="80" y="512" font-size="11" font-weight="700" fill="#6648b0" letter-spacing="1">SHARED FOUNDATION</text>
    <rect x="80" y="520" width="330" height="20" rx="5" fill="#ffffff" stroke="#cdbcea"/>
    <text x="245" y="534" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-core — LLM client · JSON parsing · config · logging</text>
    <rect x="430" y="520" width="240" height="20" rx="5" fill="#ffffff" stroke="#cdbcea"/>
    <text x="550" y="534" text-anchor="middle" font-size="10.5" fill="#24292f">fusion-cowork — DAG workflow engine</text>
    <rect x="690" y="520" width="190" height="20" rx="5" fill="#ffffff" stroke="#cdbcea"/>
    <text x="785" y="534" text-anchor="middle" font-size="10.5" fill="#24292f">MlxGEMM — custom kernels</text>
  </g>

  <!-- arrows foundation -> core -->
  <line x1="480" y1="548" x2="480" y2="570" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ INFERENCE CORE ============ -->
  <g>
    <rect x="180" y="574" width="600" height="66" rx="10" fill="#fdf6e3" stroke="#e3c76f" stroke-width="1.5"/>
    <text x="480" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">⚡ fusion-mlx — Inference Core</text>
    <text x="480" y="618" text-anchor="middle" font-size="10.5" fill="#57606a">MLX engine · OpenAI-compatible API on localhost:11434 · model cache ~/.fusion-mlx/models</text>
    <text x="480" y="632" text-anchor="middle" font-size="9.5" fill="#8a6d1a">HF mirror: hf-mirror.com</text>
  </g>

  <!-- ============ HARDWARE BAR ============ -->
  <rect x="60" y="662" width="840" height="34" rx="8" fill="#24292f"/>
  <text x="480" y="683" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Apple Silicon — M-series unified memory · macOS 14+ · local + intranet only (no outbound except 127.0.0.1)</text>

  <!-- side annotation -->
  <text x="20" y="400" font-size="10" fill="#8b949e" transform="rotate(-90 20 400)" text-anchor="middle">local-first · offline-capable</text>
</svg>
